[package]
name = "hodoo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line for the hodoo Odoo 19 client"

[[bin]]
name = "hodoo"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
clap_complete = "4"
hodoo = { path = "../hodoo" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
